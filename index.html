<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus</title>
    <style>
      html,body{background-color:#ffffff;color:#030712;min-height:100vh;min-height:100dvh;margin:0}
      html.dark,html.dark body{background-color:#030712;color:#e2e8f0}
      #root{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center}
      #loading{width:24px;height:24px;border:2px solid #e2e8f0;border-top-color:#7b68ee;border-radius:50%;animation:spin .8s linear infinite}
      html.dark #loading{border-color:#334155;border-top-color:#7b68ee}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('focus-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="loading"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
